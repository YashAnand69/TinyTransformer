name: Validate model and app
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s backend -p 'test_*.py'
